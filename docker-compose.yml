services:
  gt06-server:
    build: .
    image: gt06-decode:latest
    container_name: gt06-server
    restart: unless-stopped
    ports:
      - "${GT06_PORT:-5023}:5023"
      - "${WEB_PORT:-8080}:8080"
    environment:
      GT06_PORT: "5023"
      GT06_HOST: "0.0.0.0"
      WEB_PORT: "8080"
      WEB_HOST: "0.0.0.0"
      NODE_ENV: production
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "node", "src/healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
